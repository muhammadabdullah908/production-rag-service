
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production RAG Service</title>

    <style>
        :root {
            --bg: #f4f6f8;
            --primary: #2563eb;
            --danger: #dc2626;
            --text: #1f2937;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: white;
            padding: 20px;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            margin: 0;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
        }

        .upload-box input {
            display: none;
        }

        .doc-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex-grow: 1;
        }

        .doc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8fafc;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            border: 1px solid #e2e8f0;
        }

        .doc-name {
            overflow-wrap: anywhere;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            flex-shrink: 0;
        }

        .main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            min-width: 0;
        }

        .chat-history {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
        }

        .message.ai {
            background: white;
            border: 1px solid #e5e7eb;
            align-self: flex-start;
            width: 100%;
            max-width: 100%;
        }

        .message.error {
            color: var(--danger);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex-grow: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .input-area button {
            padding: 15px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:disabled,
        input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chunks-panel {
            margin-top: 15px;
            border-top: 1px solid #e5e7eb;
            padding-top: 15px;
            font-size: 0.85rem;
        }

        .chunks-panel h4 {
            margin: 0 0 10px;
            color: #475569;
        }

        .chunk {
            background: #f1f5f9;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid var(--primary);
        }

        .chunk-meta {
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .chunk-score {
            color: #059669;
            flex-shrink: 0;
        }

        .chunk-text {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: 260px;
            }

            .main {
                min-height: 60vh;
            }

            .message {
                max-width: 95%;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>📂 Documents</h2>

        <label class="upload-box">
            <input
                type="file"
                id="fileInput"
                accept=".pdf,.docx,.txt,.pptx,.md"
            >
            <span id="uploadText">+ Click to Upload</span>
        </label>

        <ul class="doc-list" id="docList"></ul>
    </aside>

    <main class="main">
        <div class="chat-history" id="chatHistory">
            <div class="message ai">
                Hello! Upload a document on the left, then ask me anything about it.
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="questionInput"
                placeholder="Ask a question..."
                autocomplete="off"
            >
            <button id="sendButton" type="button">Send</button>
        </div>
    </main>

    <script>
        const API = "http://127.0.0.1:8001/api";

        const fileInput = document.getElementById("fileInput");
        const uploadText = document.getElementById("uploadText");
        const docList = document.getElementById("docList");
        const chatHistory = document.getElementById("chatHistory");
        const questionInput = document.getElementById("questionInput");
        const sendButton = document.getElementById("sendButton");

        // Safely parse API responses, including non-JSON error responses.
        async function readResponse(response) {
            const text = await response.text();

            let data = {};

            if (text) {
                try {
                    data = JSON.parse(text);
                } catch {
                    data = { detail: text };
                }
            }

            if (!response.ok) {
                throw new Error(
                    data.detail || `Request failed with status ${response.status}`
                );
            }

            return data;
        }

        // Create elements using textContent rather than unsafe HTML interpolation.
        function createElement(tag, className, text) {
            const element = document.createElement(tag);

            if (className) {
                element.className = className;
            }

            if (text !== undefined) {
                element.textContent = String(text);
            }

            return element;
        }

        function addMessage(text, type = "ai") {
            const message = createElement("div", `message ${type}`, text);
            chatHistory.appendChild(message);
            scrollToBottom();
            return message;
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // Load documents when the page opens.
        window.addEventListener("DOMContentLoaded", loadDocuments);

        async function loadDocuments() {
            try {
                const response = await fetch(`${API}/documents`);
                const docs = await readResponse(response);

                docList.replaceChildren();

                if (!Array.isArray(docs)) {
                    throw new Error("Unexpected document list response.");
                }

                docs.forEach(doc => {
                    const item = createElement("li", "doc-item");

                    const name = createElement(
                        "span",
                        "doc-name",
                        `📄 ${doc.file_name || "Unnamed document"}`
                    );

                    const deleteButton = createElement(
                        "button",
                        "delete-btn",
                        "✖"
                    );

                    deleteButton.type = "button";
                    deleteButton.setAttribute(
                        "aria-label",
                        `Delete ${doc.file_name || "document"}`
                    );

                    deleteButton.addEventListener("click", () => {
                        deleteDoc(doc.doc_id);
                    });

                    item.append(name, deleteButton);
                    docList.appendChild(item);
                });

            } catch (error) {
                console.error("Failed to load documents:", error);
                addMessage(
                    `Could not load documents: ${error.message}`,
                    "ai error"
                );
            }
        }

        // Upload a document.
        fileInput.addEventListener("change", uploadFile);

        async function uploadFile() {
            const file = fileInput.files[0];

            if (!file) return;

            const formData = new FormData();
            formData.append("file", file);

            fileInput.disabled = true;
            uploadText.textContent = "Uploading...";

            try {
                const response = await fetch(`${API}/documents`, {
                    method: "POST",
                    body: formData
                });

                const data = await readResponse(response);

                alert(`Success! Added ${data.chunk_count} chunks.`);

                await loadDocuments();

            } catch (error) {
                alert(`Upload failed: ${error.message}`);

            } finally {
                fileInput.value = "";
                fileInput.disabled = false;
                uploadText.textContent = "+ Click to Upload";
            }
        }

        // Delete a document.
        async function deleteDoc(docId) {
            if (!docId) {
                alert("Invalid document ID.");
                return;
            }

            if (!confirm("Are you sure you want to delete this document?")) {
                return;
            }

            try {
                const response = await fetch(
                    `${API}/documents/${encodeURIComponent(docId)}`,
                    { method: "DELETE" }
                );

                await readResponse(response);
                await loadDocuments();

            } catch (error) {
                alert(`Failed to delete document: ${error.message}`);
            }
        }

        // Display retrieved chunks safely.
        function createChunksPanel(chunks) {
            const panel = createElement("div", "chunks-panel");

            const heading = createElement(
                "h4",
                "",
                `🔍 Retrieved ${chunks.length} Chunks`
            );

            panel.appendChild(heading);

            chunks.forEach((chunk, index) => {
                const chunkElement = createElement("div", "chunk");

                const metadata = createElement("div", "chunk-meta");

                const filename = createElement(
                    "span",
                    "",
                    `[${index + 1}] ${chunk.file_name || "Unknown document"}`
                );

                const scoreValue = Number(chunk.score);

                const score = createElement(
                    "span",
                    "chunk-score",
                    `Score: ${
                        Number.isFinite(scoreValue)
                            ? scoreValue.toFixed(4)
                            : "N/A"
                    }`
                );

                const content = createElement(
                    "div",
                    "chunk-text",
                    chunk.text || ""
                );

                metadata.append(filename, score);
                chunkElement.append(metadata, content);
                panel.appendChild(chunkElement);
            });

            return panel;
        }

        // Submit a question to the RAG API.
        sendButton.addEventListener("click", askQuestion);

        questionInput.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                askQuestion();
            }
        });

        async function askQuestion() {
            const question = questionInput.value.trim();

            if (!question || sendButton.disabled) return;

            addMessage(question, "user");
            questionInput.value = "";

            sendButton.disabled = true;
            questionInput.disabled = true;

            const loadingMessage = addMessage("Thinking...", "ai");

            try {
                const response = await fetch(`${API}/ask`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ question })
                });

                const data = await readResponse(response);

                loadingMessage.remove();

                const answerMessage = createElement("div", "message ai");

                const answer = createElement(
                    "div",
                    "",
                    data.answer || "The API returned no answer."
                );

                answerMessage.appendChild(answer);

                if (
                    Array.isArray(data.retrieved_chunks) &&
                    data.retrieved_chunks.length > 0
                ) {
                    answerMessage.appendChild(
                        createChunksPanel(data.retrieved_chunks)
                    );
                }

                chatHistory.appendChild(answerMessage);

            } catch (error) {
                loadingMessage.remove();

                addMessage(
                    `Request failed: ${error.message}. Check that the backend is running.`,
                    "ai error"
                );

            } finally {
                sendButton.disabled = false;
                questionInput.disabled = false;
                questionInput.focus();
                scrollToBottom();
            }
        }
    </script>

</body>
</html>
